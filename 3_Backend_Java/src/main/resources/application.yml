server:
  port: 8080
  address: 0.0.0.0  # 核心修改：开放监听电脑的所有网卡，允许安卓模拟器访问

spring:
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
      leak-detection-threshold: 60000
    # 修改了 host(mysql6.sqlpub.com), 端口(3311) 以及 数据库名称(smart_campus_guide)
    url: jdbc:mysql://mysql6.sqlpub.com:3311/smart_campus_guide?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    # 修改了数据库账号
    username: scg_user
    # 修改了数据库密码
    password: GkwrbnAAU5cUpcTg
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 127.0.0.1
      port: 6379
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 200MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

# DeepSeek 大模型配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-a3ac8956117f4464b5148a92501c591b}
  api-url: https://api.deepseek.com/chat/completions
  default-model: deepseek-chat
  temperature: 0.7
  max-tokens: 2048
  context-window: 10

# AI 服务地址（Python 微服务）
ai-service:
  url: http://localhost:5000

# 高德地图配置
amap:
  key: 1d921c69b95aefac2762632babd9cf09
  # 步行路径规划API地址
  direction-url: https://restapi.amap.com/v3/direction/walking

logging:
  level:
    root: info

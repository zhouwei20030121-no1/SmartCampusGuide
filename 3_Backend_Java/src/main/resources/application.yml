server:
  port: 8080

spring:
  application:
    name: campus-guide
  datasource:
    url: jdbc:mysql://localhost:3306/campus_guide?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

# DeepSeek 大模型配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-your-deepseek-key}
  api-url: https://api.deepseek.com/chat/completions
  default-model: deepseek-chat
  temperature: 0.7
  max-tokens: 2048
  context-window: 10

# AI 服务地址（Python 微服务）
ai-service:
  url: http://localhost:5000

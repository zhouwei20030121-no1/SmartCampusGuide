name: smart_campus_guide
description: "西南大学智能导览系统"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.0
  sqflite: ^2.3.0
  path: ^1.9.0
  dio: ^5.9.2
  # 地图（使用高德瓦片）
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # 摄像头
  camera: ^0.11.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
